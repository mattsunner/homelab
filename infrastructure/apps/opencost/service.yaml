---
apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: opencost
  labels:
    app: opencost
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9003
    targetPort: 9003
    protocol: TCP
  - name: http-ui
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: opencost
